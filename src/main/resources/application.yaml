spring:
  application:
    name: devtrack-api

  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:devtrack_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true